<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology Term Scavenger Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DCE3D5;
  --sheet:#FAFBF7;
  --ink:#1C2620;
  --ink-soft:#5D6A59;
  --ink-faint:#93A08D;
  --rule:#BCC7B3;
  --stamp:#6A4A87;
  --sheet-shadow:0 1px 0 #C6D0BD, 0 10px 22px -14px rgba(28,38,32,.5);
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Spectral",Georgia,serif;
  font-weight:300;
  line-height:1.6;
}

/* ---------- masthead ---------- */

.masthead{
  max-width:1180px;
  margin:0 auto;
  padding:64px 28px 30px;
}

.masthead h1{
  font-size:clamp(2rem,5.2vw,3.4rem);
  font-weight:400;
  letter-spacing:-.015em;
  line-height:1.08;
  margin:0 0 6px;
}

.byline{
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.94rem;
  color:var(--ink-soft);
  margin:0;
}

.byline em{color:var(--ink);font-style:normal}

/* 50 ticks = the actual collection, one mark per term */
.tally{
  display:flex;
  gap:3px;
  margin:30px 0 10px;
  height:22px;
  align-items:flex-end;
}

.tick{
  flex:1;
  background:var(--rule);
  height:9px;
  border-radius:1px;
}

.tick.filled{background:var(--stamp);height:22px}

.tally-note{
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.9rem;
  color:var(--ink-soft);
  margin:0;
}

/* ---------- filter ---------- */

.filters{
  max-width:1180px;
  margin:0 auto;
  padding:10px 28px 0;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  border-top:1px solid var(--rule);
  padding-top:22px;
}

.filters button{
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.9rem;
  color:var(--ink-soft);
  background:transparent;
  border:1px solid var(--rule);
  border-radius:2px;
  padding:5px 11px;
  cursor:pointer;
}

.filters button:hover{color:var(--ink);border-color:var(--ink-faint)}

.filters button[aria-pressed="true"]{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--sheet);
}

.filters button:focus-visible,
.sheet:focus-visible,
.close:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

/* ---------- grid ---------- */

main{max-width:1180px;margin:0 auto;padding:34px 28px 90px}

.unit-head{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin:44px 0 16px;
}

.unit-head:first-child{margin-top:0}

.unit-head h2{
  font-size:1.28rem;
  font-weight:400;
  margin:0;
  white-space:nowrap;
}

.unit-head .line{flex:1;height:1px;background:var(--rule)}

.unit-head .n{
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.86rem;
  color:var(--ink-faint);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
  gap:20px;
}

.sheet{
  background:var(--sheet);
  border:1px solid #D3DBCB;
  box-shadow:var(--sheet-shadow);
  padding:11px 11px 0;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  text-align:left;
  font:inherit;
  color:inherit;
  width:100%;
}

.sheet .frame{
  aspect-ratio:4/5;
  background:#EDF1E8;
  border:1px solid #E0E6D9;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sheet .frame img{width:100%;height:100%;object-fit:cover;display:block}

.sheet .hint{
  font-size:.83rem;
  font-style:italic;
  color:var(--ink-faint);
  padding:14px;
  text-align:center;
  line-height:1.45;
}

/* label block, bottom of the sheet — as on a real specimen sheet */
.label{padding:11px 1px 13px}

.label .meta{
  display:flex;
  justify-content:space-between;
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.78rem;
  color:var(--ink-faint);
  margin-bottom:3px;
}

.label .acc{color:var(--stamp)}

.label .name{font-size:1.06rem;line-height:1.25}

.sheet.empty{box-shadow:none;border-style:dashed;border-color:#C3CDBA;background:#F1F4ED}
.sheet.empty .name{color:var(--ink-faint)}

/* ---------- detail ---------- */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(24,33,27,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
  z-index:50;
}

.overlay.open{display:flex}

.detail{
  background:var(--sheet);
  max-width:900px;
  width:100%;
  max-height:92vh;
  overflow:auto;
  padding:26px;
  position:relative;
  display:grid;
  gap:26px;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
}

.detail .frame{background:#EDF1E8;border:1px solid #E0E6D9;min-height:220px}
.detail .frame img{width:100%;display:block}

.detail .acc{
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.82rem;
  color:var(--stamp);
  margin:0 0 2px;
}

.detail .unit{
  font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.86rem;
  color:var(--ink-faint);
  margin:0 0 14px;
}

.detail h3{
  font-size:1.85rem;
  font-weight:400;
  margin:0 0 16px;
  line-height:1.15;
}

.detail p.caption{margin:0;font-size:1.03rem;max-width:60ch}

.detail p.todo{margin:0;color:var(--ink-faint);font-style:italic}

.close{
  position:absolute;
  top:12px;
  right:14px;
  background:transparent;
  border:0;
  font-size:1.6rem;
  line-height:1;
  color:var(--ink-soft);
  cursor:pointer;
  padding:4px 8px;
}

@media (max-width:720px){
  .masthead{padding-top:40px}
  .detail{grid-template-columns:1fr;padding:20px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .tally{gap:2px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <h1>Biology Term Scavenger Hunt</h1>
  <p class="byline" id="byline"></p>
  <div class="tally" id="tally" aria-hidden="true"></div>
  <p class="tally-note" id="tallyNote"></p>
</header>

<nav class="filters" id="filters" aria-label="Filter by unit"></nav>

<main id="main"></main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="detailName">
  <div class="detail" id="detail">
    <button class="close" id="close" aria-label="Close">&times;</button>
  </div>
</div>

<script src="terms.js"></script>
<script>
(function(){
  var terms = COLLECTION.terms;
  var filter = 0;

  terms.forEach(function(t,i){ t.acc = String(i+1).padStart(2,"0"); });

  function done(t){ return t.caption.trim() !== "" && t.image.trim() !== ""; }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function para(s){
    return esc(s).replace(/\n{2,}/g, "</p><p class=\"caption\">").replace(/\n/g, "<br>");
  }

  /* masthead */
  document.getElementById("byline").innerHTML =
    "Collected by <em>" + COLLECTION.student + "</em> &nbsp;·&nbsp; identifier in every frame: " +
    COLLECTION.identifier;

  function drawTally(){
    var n = terms.filter(done).length;
    document.getElementById("tally").innerHTML =
      terms.map(function(t){ return '<span class="tick' + (done(t) ? " filled" : "") + '"></span>'; }).join("");
    document.getElementById("tallyNote").textContent =
      n + " of " + terms.length + " mounted";
  }

  /* filters */
  var units = [0].concat(Object.keys(UNIT_NAMES).map(Number));
  document.getElementById("filters").innerHTML = units.map(function(u){
    return '<button data-u="' + u + '" aria-pressed="' + (u === 0) + '">' +
      (u === 0 ? "All 50" : "Unit " + u) + "</button>";
  }).join("");

  document.getElementById("filters").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    filter = Number(b.dataset.u);
    [].forEach.call(this.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", Number(x.dataset.u) === filter);
    });
    render();
  });

  /* grid */
  function sheetHTML(t,i){
    var body = t.image
      ? '<img src="images/' + encodeURIComponent(t.image) + '" alt="' + esc(t.term) + ' specimen" loading="lazy">'
      : '<span class="hint">' + esc(t.hint || "not collected yet") + "</span>";
    return '<button class="sheet' + (done(t) ? "" : " empty") + '" data-i="' + i + '">' +
      '<span class="frame">' + body + "</span>" +
      '<span class="label">' +
        '<span class="meta"><span class="acc">' + t.acc + "</span><span>Unit " + t.unit + "</span></span>" +
        '<span class="name">' + esc(t.term) + "</span>" +
      "</span></button>";
  }

  function render(){
    var shown = units.slice(1).filter(function(u){ return filter === 0 || filter === u; });
    document.getElementById("main").innerHTML = shown.map(function(u){
      var list = terms.map(function(t,i){ return {t:t,i:i}; })
                      .filter(function(x){ return x.t.unit === u; });
      if(!list.length) return "";
      var n = list.filter(function(x){ return done(x.t); }).length;
      return '<section><div class="unit-head"><h2>' + UNIT_NAMES[u] + "</h2>" +
        '<span class="line"></span><span class="n">' + n + " / " + list.length + "</span></div>" +
        '<div class="grid">' + list.map(function(x){ return sheetHTML(x.t, x.i); }).join("") +
        "</div></section>";
    }).join("");
    drawTally();
  }

  /* detail */
  var overlay = document.getElementById("overlay");
  var detail  = document.getElementById("detail");
  var closeBtn = document.getElementById("close");
  var lastFocus = null;

  document.getElementById("main").addEventListener("click", function(e){
    var s = e.target.closest(".sheet");
    if(!s) return;
    open(terms[Number(s.dataset.i)], s);
  });

  function open(t, src){
    lastFocus = src;
    var img = t.image
      ? '<img src="images/' + encodeURIComponent(t.image) + '" alt="' + esc(t.term) + ' specimen">'
      : "";
    var cap = t.caption
      ? '<p class="caption">' + para(t.caption) + "</p>"
      : '<p class="todo">Caption not written yet.' +
        (t.hint ? " Planned specimen: " + esc(t.hint) + "." : "") + "</p>";
    detail.innerHTML =
      '<button class="close" id="close" aria-label="Close">&times;</button>' +
      '<div class="frame">' + img + "</div>" +
      '<div><p class="acc">' + t.acc + '</p><p class="unit">Unit ' + t.unit + " · " + esc(UNIT_NAMES[t.unit]) +
      '</p><h3 id="detailName">' + esc(t.term) + "</h3>" + cap + "</div>";
    overlay.classList.add("open");
    detail.querySelector(".close").addEventListener("click", close);
    detail.querySelector(".close").focus();
  }

  function close(){
    overlay.classList.remove("open");
    if(lastFocus) lastFocus.focus();
  }

  overlay.addEventListener("click", function(e){ if(e.target === overlay) close(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });

  render();
})();
</script>
</body>
</html>
