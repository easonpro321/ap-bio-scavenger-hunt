label.fld{display:block;font-family:"Archivo Narrow",Arial,sans-serif;

.meter.short{color:var(--warn)}

.panel-nav{display:flex;gap:8px;justify-content:space-between;

<script src="terms.js"><\/script>
<script>
(function(){
  var terms = COLLECTION.terms;
  var filter = 0;

  terms.forEach(function(t,i){ t.acc = String(i+1).padStart(2,"0"); });

  function done(t){ return t.caption.trim() !== "" && t.image.trim() !== ""; }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function para(s){
    return esc(s).replace(/\n{2,}/g, "</p><p class=\"caption\">").replace(/\n/g, "<br>");
  }

  /* masthead */
  document.getElementById("byline").innerHTML =
    "Collected by <em>" + COLLECTION.student + "</em> &nbsp;·&nbsp; identifier in every frame: " +
    COLLECTION.identifier;

  function drawTally(){
    var n = terms.filter(done).length;
    document.getElementById("tally").innerHTML =
      terms.map(function(t){ return '<span class="tick' + (done(t) ? " filled" : "") + '"></span>'; }).join("");
    document.getElementById("tallyNote").textContent =
      n + " of " + terms.length + " mounted";
  }

  /* filters */
  var units = [0].concat(Object.keys(UNIT_NAMES).map(Number));
  document.getElementById("filters").innerHTML = units.map(function(u){
    return '<button data-u="' + u + '" aria-pressed="' + (u === 0) + '">' +
      (u === 0 ? "All 50" : "Unit " + u) + "</button>";
  }).join("");

  document.getElementById("filters").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    filter = Number(b.dataset.u);
    [].forEach.call(this.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", Number(x.dataset.u) === filter);
    });
    render();
  });

  /* grid */
  function sheetHTML(t,i){
    var body = t.image
      ? '<img src="images/' + encodeURIComponent(t.image) + '" alt="' + esc(t.term) + ' specimen" loading="lazy">'
      : '<span class="hint">' + esc(t.hint || "not collected yet") + "</span>";
    return '<button class="sheet' + (done(t) ? "" : " empty") + '" data-i="' + i + '">' +
      '<span class="frame">' + body + "</span>" +
      '<span class="label">' +
        '<span class="meta"><span class="acc">' + t.acc + "</span><span>Unit " + t.unit + "</span></span>" +
        '<span class="name">' + esc(t.term) + "</span>" +
      "</span></button>";
  }

  function render(){
    var shown = units.slice(1).filter(function(u){ return filter === 0 || filter === u; });
    document.getElementById("main").innerHTML = shown.map(function(u){
      var list = terms.map(function(t,i){ return {t:t,i:i}; })
                      .filter(function(x){ return x.t.unit === u; });
      if(!list.length) return "";
      var n = list.filter(function(x){ return done(x.t); }).length;
      return '<section><div class="unit-head"><h2>' + UNIT_NAMES[u] + "</h2>" +
        '<span class="line"></span><span class="n">' + n + " / " + list.length + "</span></div>" +
        '<div class="grid">' + list.map(function(x){ return sheetHTML(x.t, x.i); }).join("") +
        "</div></section>";
    }).join("");
    drawTally();
  }

  /* detail */
  var overlay = document.getElementById("overlay");
  var detail  = document.getElementById("detail");
  var closeBtn = document.getElementById("close");
  var lastFocus = null;

  document.getElementById("main").addEventListener("click", function(e){
    var s = e.target.closest(".sheet");
    if(!s) return;
    open(terms[Number(s.dataset.i)], s);
  });

  function open(t, src){
    lastFocus = src;
    var img = t.image
      ? '<img src="images/' + encodeURIComponent(t.image) + '" alt="' + esc(t.term) + ' specimen">'
      : "";
    var cap = t.caption
      ? '<p class="caption">' + para(t.caption) + "</p>"
      : '<p class="todo">Caption not written yet.' +
        (t.hint ? " Planned specimen: " + esc(t.hint) + "." : "") + "</p>";
    detail.innerHTML =
      '<button class="close" id="close" aria-label="Close">&times;</button>' +
      '<div class="frame">' + img + "</div>" +
      '<div><p class="acc">' + t.acc + '</p><p class="unit">Unit ' + t.unit + " · " + esc(UNIT_NAMES[t.unit]) +
      '</p><h3 id="detailName">' + esc(t.term) + "</h3>" + cap + "</div>";
    overlay.classList.add("open");
    detail.querySelector(".close").addEventListener("click", close);
    detail.querySelector(".close").focus();
  }

  function close(){
    overlay.classList.remove("open");
    if(lastFocus) lastFocus.focus();
  }

  overlay.addEventListener("click", function(e){ if(e.target === overlay) close(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });

  render();
})();
<\/script>

  [4,"Homologous","Structures sharing an origin"],
  [5,"Alleles","Indian corn — every kernel a genotype"],
  [5,"Laws of probability","Mixed bean bag, or a coin toss setup"],
  [5,"X-linked","Calico cat"],
  [5,"Polyploidy","Banana or strawberry"],
  [6,"Virus","Mosaic-patterned or streaked leaf"],
  [6,"Mutation","Four-leaf clover, or variegated leaf"],
  [7,"Adaptation","Burrs, thorns, waxy leaf cuticle"],
  [7,"Natural selection","Trait that clearly pays off in this habitat"],
  [7,"Analogous","Dragonfly wing beside a bird feather"],
  [7,"Species","Lichen — one name, two organisms"],
  [8,"Population","One species, one place, counted"],
  [8,"Dispersion","Turkey flock, clumped"],
  [8,"Mutualism","Lichen on bark"],
  [8,"Commensalism","Moss on a trunk"],
  [8,"Parasitism","Powdery mildew, oak gall, or aphids"],
  [8,"Predation","Spider web with prey"]
];

/* ---------- state ---------- */

var KEY = "apbio-collection-v1";
var data = null, cur = -1;

function seed(){
  return {
    student:"YOUR NAME",
    identifier:"describe your identifier here",
    terms: SEED.map(function(r){
      return {unit:r[0], term:r[1], hint:r[2], caption:"", img:""};
    })
  };
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && p.terms && p.terms.length) return p;
    }
  }catch(e){}
  return seed();
}

var saveTimer=null, warned=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); warned=false; }
    catch(e){
      if(!warned){ warned=true;
        toast("This browser's storage is full. Export a backup now, then remove a photo or two."); }
    }
  }, 250);
}

function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(el._t);
  el._t=setTimeout(function(){ el.classList.remove("show"); }, 3400);
}

function fail(html){
  var el=document.getElementById("fail");
  el.innerHTML=html; el.classList.add("show");
}

/* ---------- helpers ---------- */

function acc(i){ return String(i+1).padStart(2,"0"); }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function sentences(s){
  var m=s.trim().match(/[^.!?]+[.!?]+/g);
  return m ? m.length : (s.trim() ? 1 : 0);
}
function state(t){
  if(t.img && t.caption.trim()) return "done";
  if(t.img || t.caption.trim())  return "partial";
  return "empty";
}

function readImage(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=1400, w=im.width, h=im.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var c=document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.82));
    };
    im.onerror=function(){ toast("That file could not be read as an image."); };
    im.src=fr.result;
  };
  fr.onerror=function(){ toast("Could not read that file."); };
  fr.readAsDataURL(file);
}

/* ---------- grid ---------- */

function render(){
  var units=Object.keys(UNIT_NAMES).map(Number);
  document.getElementById("main").innerHTML=units.map(function(u){
    var list=data.terms.map(function(t,i){ return {t:t,i:i}; })
                       .filter(function(x){ return x.t.unit===u; });
    if(!list.length) return "";
    var n=list.filter(function(x){ return state(x.t)==="done"; }).length;
    return '<section><div class="unit-head"><h2>'+UNIT_NAMES[u]+'</h2>'+
      '<span class="line"></span><span class="n">'+n+" / "+list.length+
      '</span></div><div class="grid">'+
      list.map(function(x){ return sheetHTML(x.t,x.i); }).join("")+
      '</div></section>';
  }).join("");
  var done=data.terms.filter(function(t){ return state(t)==="done"; }).length;
  document.getElementById("count").textContent=done+" of "+data.terms.length+" finished";
}

function sheetHTML(t,i){
  var body=t.img ? '<img src="'+t.img+'" alt="">'
                 : '<span class="hint">'+esc(t.hint||"no photo yet")+'</span>';
  return '<button type="button" class="sheet '+state(t)+'" data-i="'+i+'">'+
    '<span class="frame">'+body+'</span><span class="label">'+
    '<span class="meta"><span class="acc">'+acc(i)+'</span><span>Unit '+t.unit+'</span></span>'+
    '<span class="name">'+esc(t.term)+'</span></span></button>';
}

/* ---------- panel ---------- */

var overlay=document.getElementById("overlay");
var panel=document.getElementById("panel");
var filePick=document.getElementById("filePick");

document.getElementById("main").addEventListener("click",function(e){
  var s=e.target.closest(".sheet");
  if(s) openPanel(Number(s.dataset.i));
});

function openPanel(i){
  cur=i;
  var t=data.terms[i];
  panel.innerHTML=
    '<button type="button" class="close" id="pClose" aria-label="Close">&times;</button>'+
    '<div><div class="drop" id="drop">'+
      (t.img ? '<img src="'+t.img+'" alt="">'
             : '<span class="msg">Drop a photo here, or tap to choose one</span>')+
    '</div><div class="drop-actions">'+
      '<button type="button" id="pPick">Choose photo</button>'+
      (t.img ? '<button type="button" id="pClear">Remove photo</button>' : '')+
    '</div></div>'+
    '<div><p class="acc-line">'+acc(i)+'</p>'+
      '<p class="unit-line">Unit '+t.unit+' · '+UNIT_NAMES[t.unit]+'</p>'+
      '<div class="field"><label class="fld" for="pTerm">Term</label>'+
        '<input type="text" id="pTerm" value="'+esc(t.term)+'"></div>'+
      (t.hint ? '<p class="hint-line">Planned specimen: '+esc(t.hint)+'</p>' : '')+
      '<div class="field"><label class="fld" for="pCap">Your caption</label>'+
        '<textarea id="pCap" placeholder="Five sentences, in your own words.">'+esc(t.caption)+'</textarea>'+
        '<div class="meter" id="pMeter"></div></div>'+
      '<div class="panel-nav">'+
        '<button type="button" id="pPrev">&larr; Previous</button>'+
        '<button type="button" id="pNext">Next &rarr;</button>'+
      '</div></div>';
  overlay.classList.add("open");
  wirePanel();
  document.getElementById("pCap").focus();
}

function wirePanel(){
  var t=data.terms[cur];
  document.getElementById("pClose").onclick=closePanel;
  document.getElementById("pPrev").onclick=function(){ step(-1); };
  document.getElementById("pNext").onclick=function(){ step(1); };

  var drop=document.getElementById("drop");
  drop.onclick=pick;
  document.getElementById("pPick").onclick=function(e){ e.stopPropagation(); pick(); };

  var clr=document.getElementById("pClear");
  if(clr) clr.onclick=function(e){
    e.stopPropagation(); t.img=""; save(); render(); openPanel(cur);
  };

  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop",function(e){
    var f=e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) takeFile(f);
  });

  var cap=document.getElementById("pCap");
  cap.oninput=function(){ t.caption=cap.value; meter(); save(); };
  var term=document.getElementById("pTerm");
  term.oninput=function(){ t.term=term.value; save(); };
  meter();
}

function meter(){
  var t=data.terms[cur], el=document.getElementById("pMeter");
  if(!el) return;
  var n=sentences(t.caption);
  var w=t.caption.trim() ? t.caption.trim().split(/\s+/).length : 0;
  el.textContent=n+(n===1?" sentence":" sentences")+" · "+w+" words";
  el.className="meter "+(n===0?"":n<5?"short":"ok");
}

function pick(){ filePick.value=""; filePick.click(); }

filePick.onchange=function(){
  var f=filePick.files && filePick.files[0];
  if(f) takeFile(f);
};

function takeFile(f){
  if(!/^image\//.test(f.type)){ toast("That is not an image file."); return; }
  readImage(f,function(url){
    data.terms[cur].img=url;
    save(); render(); openPanel(cur);
    toast("Photo added.");
  });
}

function step(d){
  var n=cur+d;
  if(n<0 || n>=data.terms.length) return;
  openPanel(n);
}

function closePanel(){ overlay.classList.remove("open"); render(); }

overlay.addEventListener("click",function(e){ if(e.target===overlay) closePanel(); });
document.addEventListener("keydown",function(e){
  if(!overlay.classList.contains("open")) return;
  if(e.key==="Escape") closePanel();
  var typing = e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT";
  if(!typing && e.key==="ArrowLeft")  step(-1);
  if(!typing && e.key==="ArrowRight") step(1);
});

/* ---------- name & identifier ---------- */

document.getElementById("btnMeta").onclick=function(){
  var s=prompt("Your name:",data.student);
  if(s!==null && s.trim()) data.student=s.trim();
  var d=prompt("Your identifier (the object in every photo):",data.identifier);
  if(d!==null && d.trim()) data.identifier=d.trim();
  save(); toast("Saved.");
};

/* ---------- backup ---------- */

function download(blob,name){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },5000);
}

document.getElementById("btnBackup").onclick=function(){
  download(new Blob([JSON.stringify(data)],{type:"application/json"}),
           "scavenger-hunt-backup.json");
  toast("Backup downloaded.");
};

document.getElementById("btnRestore").onclick=function(){
  document.getElementById("jsonPick").click();
};

document.getElementById("jsonPick").onchange=function(){
  var f=this.files && this.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var p=JSON.parse(fr.result);
      if(!p.terms || !p.terms.length) throw 0;
      data=p; save(); render();
      toast("Backup loaded.");
    }catch(e){ toast("That file isn't a valid backup."); }
  };
  fr.readAsText(f);
};

/* ---------- export ---------- */

function buildTermsJs(){
  var lines=data.terms.map(function(t,i){
    var name = t.img ? acc(i)+"-"+(slug(t.term)||"specimen")+".jpg" : "";
    return "    { unit: "+t.unit+
      ", term: "+JSON.stringify(t.term)+
      ", image: "+JSON.stringify(name)+
      ", caption: "+JSON.stringify(t.caption)+
      ", hint: "+JSON.stringify(t.hint||"")+" }";
  });
  return "/* Generated by the editor. Re-export to update. */\n\n"+
    "const COLLECTION = {\n"+
    "  student: "+JSON.stringify(data.student)+",\n"+
    "  identifier: "+JSON.stringify(data.identifier)+",\n\n"+
    "  terms: [\n"+lines.join(",\n")+"\n  ]\n};\n\n"+
    "const UNIT_NAMES = "+JSON.stringify(UNIT_NAMES,null,2)+";\n";
}

function viewerHtml(){
  var raw=document.getElementById("viewerTpl").textContent;
  return raw.replace(/<\\\/script>/g,"<\/script>");
}

document.getElementById("btnExport").onclick=function(){
  var withPhotos=data.terms.filter(function(t){ return t.img; }).length;

  if(typeof JSZip==="undefined"){
    download(new Blob([buildTermsJs()],{type:"text/javascript"}),"terms.js");
    download(new Blob([viewerHtml()],{type:"text/html"}),"index.html");
    toast("Zip library blocked. Downloaded terms.js and index.html — photos must be saved manually.");
    return;
  }

  var zip=new JSZip();
  var imgs=zip.folder("images");

  data.terms.forEach(function(t,i){
    if(!t.img) return;
    imgs.file(acc(i)+"-"+(slug(t.term)||"specimen")+".jpg",
              t.img.split(",")[1],{base64:true});
  });
  if(!withPhotos) imgs.file(".gitkeep","");

  zip.file("terms.js",buildTermsJs());
  zip.file("index.html",viewerHtml());

  zip.generateAsync({type:"blob"}).then(function(blob){
    download(blob,"apbio-site.zip");
    toast(withPhotos+" photo"+(withPhotos===1?"":"s")+" exported. Unzip and upload the contents.");
  }).catch(function(){
    toast("Export failed. Save a backup instead and tell me what happened.");
  });
};

/* ---------- go ---------- */

function storageWorks(){
  try{
    localStorage.setItem("__probe__","1");
    localStorage.removeItem("__probe__");
    return true;
  }catch(e){ return false; }
}

try{
  data=load();
  render();
  if(!storageWorks()){
    fail("<strong>This browser will not save your work here.</strong><br>"+
         "You can still type and add photos, but everything is lost when you close the tab. "+
         "Either turn off private browsing, or upload this file to GitHub and use it from your "+
         "<code>github.io</code> address instead. Export a backup before you close the tab.");
  }
}catch(e){
  fail("<strong>The editor could not start.</strong><br>"+
       "Error: <code>"+esc(e.message||String(e))+"</code><br>"+
       "Open this file directly in Chrome or Safari, not inside another app.");
}

})();
</script>
</body>
</html>
