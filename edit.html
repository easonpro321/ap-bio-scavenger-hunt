<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor · Biology Term Scavenger Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DCE3D5; --sheet:#FAFBF7; --ink:#1C2620; --ink-soft:#5D6A59;
  --ink-faint:#93A08D; --rule:#BCC7B3; --stamp:#6A4A87; --warn:#8C4A2F;
  --sheet-shadow:0 1px 0 #C6D0BD, 0 10px 22px -14px rgba(28,38,32,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Spectral",Georgia,serif;font-weight:300;line-height:1.6}

.bar{position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:14px 24px}
.bar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;
  align-items:center;gap:14px}
.bar h1{font-size:1.15rem;font-weight:400;margin:0;flex:1;white-space:nowrap}
.bar .count{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.9rem;color:var(--ink-soft)}

button{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.9rem;
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
  border-radius:2px;padding:6px 12px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--ink-faint)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
button.primary:hover{background:#2B3A31;color:var(--sheet)}
button:focus-visible,input:focus-visible,textarea:focus-visible,
.sheet:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

.note{max-width:1180px;margin:0 auto;padding:16px 24px 0;
  font-size:.9rem;color:var(--ink-soft);max-width:74ch}

main{max-width:1180px;margin:0 auto;padding:22px 24px 90px}
.unit-head{display:flex;align-items:baseline;gap:12px;margin:36px 0 14px}
.unit-head h2{font-size:1.18rem;font-weight:400;margin:0;white-space:nowrap}
.unit-head .line{flex:1;height:1px;background:var(--rule)}
.unit-head .n{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.84rem;color:var(--ink-faint)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.sheet{background:var(--sheet);border:1px solid #D3DBCB;box-shadow:var(--sheet-shadow);
  padding:9px 9px 0;display:flex;flex-direction:column;cursor:pointer;
  text-align:left;font:inherit;color:inherit;width:100%}
.sheet .frame{aspect-ratio:4/5;background:#EDF1E8;border:1px solid #E0E6D9;
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.sheet .frame img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .hint{font-size:.8rem;font-style:italic;color:var(--ink-faint);
  padding:12px;text-align:center;line-height:1.4}
.label{padding:9px 1px 11px}
.label .meta{display:flex;justify-content:space-between;
  font-family:"Archivo Narrow",Arial,sans-serif;font-size:.76rem;
  color:var(--ink-faint);margin-bottom:2px}
.label .acc{color:var(--stamp)}
.label .name{font-size:1rem;line-height:1.25}
.sheet.partial{border-color:#D8C9A8}
.sheet.empty{box-shadow:none;border-style:dashed;border-color:#C3CDBA;background:#F1F4ED}
.sheet.empty .name{color:var(--ink-faint)}

.overlay{position:fixed;inset:0;background:rgba(24,33,27,.72);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.open{display:flex}
.panel{background:var(--sheet);max-width:940px;width:100%;max-height:93vh;
  overflow:auto;padding:24px;position:relative;display:grid;gap:24px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}

.drop{border:1px dashed var(--ink-faint);background:#EDF1E8;aspect-ratio:4/5;
  display:flex;align-items:center;justify-content:center;position:relative;
  cursor:pointer;overflow:hidden;text-align:center}
.drop.over{border-color:var(--stamp);background:#E6E2EE}
.drop img{width:100%;height:100%;object-fit:cover;display:block}
.drop .msg{padding:20px;font-size:.9rem;color:var(--ink-soft);font-style:italic}
.drop-actions{display:flex;gap:8px;margin-top:10px}

label.fld{display:block;font-family:"Archivo Narrow",Arial,sans-serif;
  font-size:.85rem;color:var(--ink-soft);margin:0 0 5px}
input[type=text],textarea{width:100%;font-family:"Spectral",Georgia,serif;
  font-weight:300;font-size:1rem;color:var(--ink);background:#fff;
  border:1px solid var(--rule);border-radius:2px;padding:9px 10px;line-height:1.55}
textarea{min-height:210px;resize:vertical}
.field{margin-bottom:16px}

.acc-line{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.82rem;
  color:var(--stamp);margin:0 0 2px}
.unit-line{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.85rem;
  color:var(--ink-faint);margin:0 0 14px}
.hint-line{font-size:.88rem;font-style:italic;color:var(--ink-faint);margin:0 0 16px}
.meter{font-family:"Archivo Narrow",Arial,sans-serif;font-size:.83rem;
  color:var(--ink-faint);margin-top:6px}
.meter.short{color:var(--warn)}
.meter.ok{color:var(--stamp)}

.panel-nav{display:flex;gap:8px;justify-content:space-between;
  border-top:1px solid var(--rule);padding-top:14px;margin-top:4px}
.close{position:absolute;top:10px;right:12px;background:transparent;border:0;
  font-size:1.6rem;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:2px;
  font-family:"Archivo Narrow",Arial,sans-serif;font-size:.9rem;
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:760px){
  .panel{grid-template-columns:1fr;padding:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .bar h1{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <h1>Scavenger hunt editor</h1>
    <span class="count" id="count">—</span>
    <button id="btnMeta">Name &amp; identifier</button>
    <button id="btnBackup">Save backup</button>
    <button id="btnRestore">Load backup</button>
    <button class="primary" id="btnExport">Export site</button>
  </div>
</div>

<p class="note" id="note">
  Your work saves in this browser as you type. It is not on the internet yet.
  Use <em>Export site</em> when you want the files to upload to GitHub, and
  <em>Save backup</em> now and then so a cleared browser can't cost you anything.
</p>

<main id="main"></main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="pName">
  <div class="panel" id="panel"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>

<script src="terms.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){

/* ---------- state ---------- */

var KEY = "apbio-collection-v1";
var data = null;
var cur  = -1;

function seed(){
  return {
    student: COLLECTION.student,
    identifier: COLLECTION.identifier,
    terms: COLLECTION.terms.map(function(t){
      return {unit:t.unit, term:t.term, hint:t.hint||"", caption:"", img:""};
    })
  };
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && p.terms && p.terms.length) return p;
    }
  }catch(e){}
  return seed();
}

var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ toast("Browser storage is full — export a backup now."); }
  }, 250);
}

function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("show"); }, 2600);
}

/* ---------- helpers ---------- */

function acc(i){ return String(i+1).padStart(2,"0"); }

function slug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function sentences(s){
  var m = s.trim().match(/[^.!?]+[.!?]+/g);
  return m ? m.length : (s.trim() ? 1 : 0);
}

function state(t){
  if(t.img && t.caption.trim()) return "done";
  if(t.img || t.caption.trim())  return "partial";
  return "empty";
}

/* resize to keep files small and localStorage happy */
function readImage(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var im = new Image();
    im.onload = function(){
      var max = 1400;
      var w = im.width, h = im.height;
      if(w > h && w > max){ h = Math.round(h * max / w); w = max; }
      else if(h >= w && h > max){ w = Math.round(w * max / h); h = max; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(im, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = function(){ toast("That file could not be read as an image."); };
    im.src = fr.result;
  };
  fr.onerror = function(){ toast("Could not read that file."); };
  fr.readAsDataURL(file);
}

/* ---------- grid ---------- */

function render(){
  var units = Object.keys(UNIT_NAMES).map(Number);
  document.getElementById("main").innerHTML = units.map(function(u){
    var list = data.terms.map(function(t,i){ return {t:t,i:i}; })
                         .filter(function(x){ return x.t.unit === u; });
    if(!list.length) return "";
    var n = list.filter(function(x){ return state(x.t) === "done"; }).length;
    return '<section><div class="unit-head"><h2>' + UNIT_NAMES[u] + '</h2>' +
      '<span class="line"></span><span class="n">' + n + " / " + list.length +
      '</span></div><div class="grid">' +
      list.map(function(x){ return sheetHTML(x.t, x.i); }).join("") +
      '</div></section>';
  }).join("");

  var done = data.terms.filter(function(t){ return state(t) === "done"; }).length;
  document.getElementById("count").textContent = done + " of " + data.terms.length + " finished";
}

function sheetHTML(t,i){
  var body = t.img
    ? '<img src="' + t.img + '" alt="">'
    : '<span class="hint">' + esc(t.hint || "no photo yet") + '</span>';
  return '<button class="sheet ' + state(t) + '" data-i="' + i + '">' +
    '<span class="frame">' + body + '</span><span class="label">' +
    '<span class="meta"><span class="acc">' + acc(i) + '</span><span>Unit ' + t.unit + '</span></span>' +
    '<span class="name">' + esc(t.term) + '</span></span></button>';
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* ---------- panel ---------- */

var overlay = document.getElementById("overlay");
var panel   = document.getElementById("panel");
var filePick= document.getElementById("filePick");

document.getElementById("main").addEventListener("click", function(e){
  var s = e.target.closest(".sheet");
  if(s) openPanel(Number(s.dataset.i));
});

function openPanel(i){
  cur = i;
  var t = data.terms[i];
  panel.innerHTML =
    '<button class="close" id="pClose" aria-label="Close">&times;</button>' +
    '<div>' +
      '<div class="drop" id="drop">' +
        (t.img ? '<img src="' + t.img + '" alt="">'
               : '<span class="msg">Drop a photo here, or tap to choose one</span>') +
      '</div>' +
      '<div class="drop-actions">' +
        '<button id="pPick">Choose photo</button>' +
        (t.img ? '<button id="pClear">Remove photo</button>' : '') +
      '</div>' +
    '</div>' +
    '<div>' +
      '<p class="acc-line">' + acc(i) + '</p>' +
      '<p class="unit-line">Unit ' + t.unit + ' · ' + UNIT_NAMES[t.unit] + '</p>' +
      '<div class="field"><label class="fld" for="pTerm">Term</label>' +
        '<input type="text" id="pTerm" value="' + esc(t.term) + '"></div>' +
      (t.hint ? '<p class="hint-line">Planned specimen: ' + esc(t.hint) + '</p>' : '') +
      '<div class="field"><label class="fld" for="pCap">Your caption</label>' +
        '<textarea id="pCap" placeholder="Five sentences, in your own words.">' + esc(t.caption) + '</textarea>' +
        '<div class="meter" id="pMeter"></div></div>' +
      '<div class="panel-nav">' +
        '<button id="pPrev">&larr; Previous</button>' +
        '<button id="pNext">Next &rarr;</button>' +
      '</div>' +
    '</div>';

  overlay.classList.add("open");
  wirePanel();
  document.getElementById("pCap").focus();
}

function wirePanel(){
  var t = data.terms[cur];

  document.getElementById("pClose").onclick = closePanel;
  document.getElementById("pPrev").onclick  = function(){ step(-1); };
  document.getElementById("pNext").onclick  = function(){ step(1); };

  var drop = document.getElementById("drop");
  drop.onclick = pick;
  document.getElementById("pPick").onclick = function(e){ e.stopPropagation(); pick(); };

  var clr = document.getElementById("pClear");
  if(clr) clr.onclick = function(e){
    e.stopPropagation();
    t.img = ""; save(); render(); openPanel(cur);
  };

  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function(e){
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) takeFile(f);
  });

  var cap = document.getElementById("pCap");
  cap.oninput = function(){ t.caption = cap.value; meter(); save(); };

  var term = document.getElementById("pTerm");
  term.oninput = function(){ t.term = term.value; save(); };

  meter();
}

function meter(){
  var t = data.terms[cur];
  var el = document.getElementById("pMeter");
  if(!el) return;
  var n = sentences(t.caption);
  var w = t.caption.trim() ? t.caption.trim().split(/\s+/).length : 0;
  el.textContent = n + (n === 1 ? " sentence" : " sentences") + " · " + w + " words";
  el.className = "meter " + (n === 0 ? "" : n < 5 ? "short" : "ok");
}

function pick(){
  filePick.value = "";
  filePick.click();
}

filePick.onchange = function(){
  var f = filePick.files && filePick.files[0];
  if(f) takeFile(f);
};

function takeFile(f){
  if(!/^image\//.test(f.type)){ toast("That is not an image file."); return; }
  readImage(f, function(dataUrl){
    data.terms[cur].img = dataUrl;
    save(); render(); openPanel(cur);
    toast("Photo added.");
  });
}

function step(d){
  var n = cur + d;
  if(n < 0 || n >= data.terms.length) return;
  openPanel(n);
}

function closePanel(){ overlay.classList.remove("open"); render(); }

overlay.addEventListener("click", function(e){ if(e.target === overlay) closePanel(); });
document.addEventListener("keydown", function(e){
  if(!overlay.classList.contains("open")) return;
  if(e.key === "Escape") closePanel();
  if(e.key === "ArrowLeft"  && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "INPUT") step(-1);
  if(e.key === "ArrowRight" && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "INPUT") step(1);
});

/* ---------- name & identifier ---------- */

document.getElementById("btnMeta").onclick = function(){
  var s = prompt("Your name:", data.student);
  if(s !== null) data.student = s.trim() || data.student;
  var d = prompt("Your identifier (the object in every photo):", data.identifier);
  if(d !== null) data.identifier = d.trim() || data.identifier;
  save();
  toast("Saved.");
};

/* ---------- backup ---------- */

function download(blob, name){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}

document.getElementById("btnBackup").onclick = function(){
  download(new Blob([JSON.stringify(data)], {type:"application/json"}),
           "scavenger-hunt-backup.json");
  toast("Backup downloaded.");
};

document.getElementById("btnRestore").onclick = function(){
  document.getElementById("jsonPick").click();
};

document.getElementById("jsonPick").onchange = function(){
  var f = this.files && this.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var p = JSON.parse(fr.result);
      if(!p.terms || !p.terms.length) throw 0;
      data = p; save(); render();
      toast("Backup loaded.");
    }catch(e){ toast("That file isn't a valid backup."); }
  };
  fr.readAsText(f);
};

/* ---------- export ---------- */

document.getElementById("btnExport").onclick = function(){
  if(typeof JSZip === "undefined"){
    toast("Zip library didn't load — check your connection and refresh.");
    return;
  }
  var zip = new JSZip();
  var imgs = zip.folder("images");
  var lines = [];

  data.terms.forEach(function(t,i){
    var name = "";
    if(t.img){
      name = acc(i) + "-" + (slug(t.term) || "specimen") + ".jpg";
      imgs.file(name, t.img.split(",")[1], {base64:true});
    }
    lines.push("    { unit: " + t.unit +
      ", term: " + JSON.stringify(t.term) +
      ", image: " + JSON.stringify(name) +
      ", caption: " + JSON.stringify(t.caption) +
      ", hint: " + JSON.stringify(t.hint || "") + " }");
  });

  var js =
    "/* Generated by the editor. Re-export to update. */\n\n" +
    "const COLLECTION = {\n" +
    "  student: " + JSON.stringify(data.student) + ",\n" +
    "  identifier: " + JSON.stringify(data.identifier) + ",\n\n" +
    "  terms: [\n" + lines.join(",\n") + "\n  ]\n};\n\n" +
    "const UNIT_NAMES = " + JSON.stringify(UNIT_NAMES, null, 2) + ";\n";

  zip.file("terms.js", js);
  if(!Object.keys(imgs.files).length) imgs.file(".gitkeep", "");

  var gotViewer = false;

  fetch("index.html")
    .then(function(r){ return r.ok ? r.text() : null; })
    .catch(function(){ return null; })
    .then(function(html){
      if(html){ zip.file("index.html", html); gotViewer = true; }
      return zip.generateAsync({type:"blob"});
    })
    .then(function(blob){
      download(blob, "apbio-site.zip");
      toast(gotViewer
        ? "Exported. Unzip and upload the contents to GitHub."
        : "Exported terms.js and images. Add index.html yourself.");
    });
};

/* ---------- go ---------- */

data = load();
render();

})();
</script>
</body>
</html>
